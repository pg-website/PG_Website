openapi: 3.0.3
info:
  title: PG Chess Backend API
  version: 0.3.0
  description: |
    Implemented endpoints of the Django REST backend (`backend/`), generated from the code on 2026-10-27.
    Import into Apidog via **Project Settings > Import Data > OpenAPI/Swagger**.

    **Scope.** Covers what exists now: health, auth, profile, public content, registrations (free, waitlist, offer, cancel),
    payments (R04, R05) and the Razorpay webhook (W01), player area, event room and ratings. NOT included because they are
    not built yet: admin routes other than ping, dashboard, events, rounds, control room, media, CMS and preview (BE-10 onward).
    The failure envelope's `error` gains an optional `blockers[]` (NOT_PUBLISHABLE only).

    **Envelope.** Every `/api/*` response is `{success, message, data, error, meta}` (envelope keys snake_case, keys inside
    `data` camelCase). Errors carry a stable `error.code`. Lists carry `meta.pagination`.

    **Auth.** `Authorization: Bearer <accessToken>`. Token mode is chosen by the server (`AUTH_TOKEN_MODE`):
    `body` returns `refreshToken` in `data`; `cookie` sets an httpOnly refresh cookie and requires a non-empty
    `X-CSRF-Token` header on refresh and logout.

    **Idempotency.** Endpoints marked "Idempotency-Key required" return `400 VALIDATION_FAILED` without the header.
    Replays return the original response with `Idempotent-Replay: true`.

    **Use in Apidog.** After import, create an environment with `baseUrl = http://localhost:8000` and a `token` variable.
    Run `Auth / Login`, copy `data.accessToken` into `token`.
  contact:
    name: PG Chess
servers:
  - url: http://localhost:8000/api
    description: Local development
  - url: '{baseUrl}/api'
    description: Custom environment
    variables:
      baseUrl:
        default: http://localhost:8000
tags:
  - name: System
  - name: Auth
  - name: Profile
  - name: Public content
  - name: Registration
  - name: Player area
  - name: Event room
  - name: Ratings
  - name: Admin
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness and database ping
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: {type: string, example: ok}
                          database: {type: boolean, example: true}
                          serverNow: {type: string, format: date-time}
        '500': {$ref: '#/components/responses/Error'}

  # ----------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: A01 Create an account
      description: "When the admin setting `auth.signupOpen` is false the call is refused with 403 `SIGNUP_CLOSED` (a Tier C code ratified in BE-14; the web adds copy, until then it falls back to the HTTP-status copy)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 80, example: Asha Rao}
                email: {type: string, format: email, example: asha@example.com}
                password: {type: string, format: password, example: 'correct-horse-battery'}
                city: {type: string, maxLength: 80}
                phone: {type: string, minLength: 7, maxLength: 20}
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {description: 'SIGNUP_CLOSED', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '409': {description: 'EMAIL_TAKEN', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '429': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [Auth]
      summary: A02 Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {description: 'INVALID_CREDENTIALS or AUTH_REQUIRED (reason ACCOUNT_SUSPENDED)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '429': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [Auth]
      summary: A03 Rotate the refresh token
      description: |
        Body mode: send `refreshToken` in the JSON body. Cookie mode: the cookie is read and `X-CSRF-Token` must be a
        non-empty header. A reused token revokes the whole session family (`AUTH_REQUIRED`, reason `REFRESH_REUSED`).
      security: []
      parameters:
        - {name: X-CSRF-Token, in: header, required: false, schema: {type: string}, description: Required in cookie mode}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: A04 Sign out (revokes the session family)
      description: Always succeeds. Cookie mode requires `X-CSRF-Token`.
      security: []
      parameters:
        - {name: X-CSRF-Token, in: header, required: false, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: {type: string}
      responses:
        '200': {$ref: '#/components/responses/EmptyOk'}
  /auth/me:
    get:
      tags: [Auth]
      summary: A05 Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/password-reset:
    post:
      tags: [Auth]
      summary: A06 Request a password reset (neutral response)
      description: Identical 200 for known and unknown emails.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: {type: string, format: email}
      responses:
        '200': {$ref: '#/components/responses/EmptyOk'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: A07 Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              additionalProperties: false
              properties:
                token: {type: string, maxLength: 512}
                newPassword: {type: string, format: password}
      responses:
        '200': {$ref: '#/components/responses/EmptyOk'}
        '400': {description: 'RESET_TOKEN_INVALID, WEAK_PASSWORD or VALIDATION_FAILED', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '429': {$ref: '#/components/responses/Error'}
  /auth/step-up:
    post:
      tags: [Auth]
      summary: Re-enter password to obtain a single-use step-up grant (5 minutes)
      description: 'The grant is sent on the guarded call in the `X-Step-Up-Token` header; `Authorization: Bearer` stays the access token (decided BE-14; web adapter change is an FE task).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: {type: string, format: password}
      responses:
        '200':
          description: Grant token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /auth/oauth/google/start:
    get:
      tags: [Auth]
      summary: A08 Google sign-in start (flag-gated stub, 404 NOT_FOUND today)
      security: []
      responses:
        '404': {$ref: '#/components/responses/Error'}
  /auth/oauth/exchange:
    post:
      tags: [Auth]
      summary: A09 Google code exchange (flag-gated stub, 404 NOT_FOUND today)
      security: []
      responses:
        '404': {$ref: '#/components/responses/Error'}
  /auth/oauth/google/callback:
    get:
      tags: [Auth]
      summary: A10 Google provider callback (flag-gated stub, 404 NOT_FOUND today)
      security: []
      responses:
        '404': {$ref: '#/components/responses/Error'}

  # ----------------------------------------------------------------- Profile
  /me/profile:
    get:
      tags: [Profile]
      summary: M13 Private profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Profile]
      summary: M14 Update allow-listed private fields
      description: Unknown keys (role, email, ratings, id) are rejected with `VALIDATION_FAILED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 80}
                city: {type: string, maxLength: 80}
                area: {type: string, maxLength: 80}
                phone: {type: string, minLength: 7, maxLength: 20}
                birthday: {type: string, format: date}
                chessComHandle: {type: string, minLength: 3, maxLength: 25}
                fideId: {type: string, minLength: 3, maxLength: 12}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Profile'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /me/public-identity:
    patch:
      tags: [Profile]
      summary: M15 Visibility toggles for the public identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                showDisplayName: {type: boolean}
                showRatings: {type: boolean}
                showChessComHandle: {type: boolean}
                showCityChapter: {type: boolean}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Profile'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /me/preferences:
    patch:
      tags: [Profile]
      summary: M16 First-login preferences (saving or skipping both finish onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                playStyle: {type: string, enum: [figuring_out, mostly_online, club_player, tournament_player]}
                mood: {type: string, enum: [play, improve, compete, meet_people]}
                skipped: {type: boolean}
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Me'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}

  # ----------------------------------------------------------------- Public content
  /site/{section}:
    get:
      tags: [Public content]
      summary: P01 Published site section
      description: Cache `public, s-maxage=60, stale-while-revalidate=300`.
      security: []
      parameters:
        - name: section
          in: path
          required: true
          schema: {type: string, enum: [home, community, nav, footer, meta]}
        - {$ref: '#/components/parameters/PreviewKey'}
      responses:
        '200':
          description: Section with resolved media collections
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          key: {type: string}
                          version: {type: integer, format: int64}
                          updatedAt: {type: string, format: date-time}
                          content: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/Error'}
  /events:
    get:
      tags: [Public content]
      summary: P02 Upcoming published events
      security: []
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: type, in: query, schema: {type: string, enum: [social, rated_tournament, league, workshop, special]}}
        - {name: audience, in: query, schema: {type: string, enum: [all_levels, beginner, solo]}}
        - {name: free, in: query, schema: {type: boolean}}
        - {name: city, in: query, schema: {type: string, maxLength: 80}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Page of event cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/EventCard'}
        '400': {$ref: '#/components/responses/Error'}
  /events/{slug}:
    get:
      tags: [Public content]
      summary: P03 Event detail by slug
      security: []
      parameters:
        - {$ref: '#/components/parameters/Slug'}
        - {$ref: '#/components/parameters/PreviewKey'}
      responses:
        '200':
          description: Event detail (completed events include `archive` when published)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/EventDetail'}
        '404': {description: EVENT_NOT_FOUND, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /events/{slug}/availability:
    get:
      tags: [Public content]
      summary: P04 Live availability (no-store)
      security: []
      parameters:
        - {$ref: '#/components/parameters/Slug'}
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: {type: string, example: open}
                          placesLeft: {type: integer, nullable: true, description: 'For an unlimited event (null capacity) this is the sentinel 100000 and `unlimited` is true.'}
                          unlimited: {type: boolean, description: 'Present and true only for an event with no capacity limit (additive).'}
                          waitlistOpen: {type: boolean}
                          serverNow: {type: string, format: date-time}
        '404': {$ref: '#/components/responses/Error'}
  /past-events:
    get:
      tags: [Public content]
      summary: P05 Completed events
      security: []
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: type, in: query, schema: {type: string, enum: [social, rated_tournament, league, workshop, special]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Page of event cards (`archivePublished` flag set)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/EventCard'}
  /stories:
    get:
      tags: [Public content]
      summary: P06 Published stories
      security: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: Page of story cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/StoryCard'}
  /stories/{slug}:
    get:
      tags: [Public content]
      summary: P07 Story detail (closed block body, no HTML)
      security: []
      parameters:
        - {$ref: '#/components/parameters/Slug'}
        - {$ref: '#/components/parameters/PreviewKey'}
      responses:
        '200':
          description: Story
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/StoryCard'
                          - type: object
                            properties:
                              eyebrow: {type: string}
                              body: {type: array, items: {type: object, additionalProperties: true}}
                              updatedAt: {type: string, format: date-time}
        '404': {$ref: '#/components/responses/Error'}
  /testimonials:
    get:
      tags: [Public content]
      summary: P08 Published testimonials
      security: []
      responses:
        '200':
          description: Testimonials
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: string, format: uuid}
                            quote: {type: string}
                            name: {type: string}
                            descriptor: {type: string}
                            portrait: {$ref: '#/components/schemas/Media'}
                            version: {type: integer, format: int64}
  /legal/{page}:
    get:
      tags: [Public content]
      summary: P09 Legal page
      security: []
      parameters:
        - name: page
          in: path
          required: true
          schema: {type: string, enum: [privacy, terms, refund-policy]}
        - {$ref: '#/components/parameters/PreviewKey'}
      responses:
        '200':
          description: Legal page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          page: {type: string}
                          title: {type: string}
                          blocks: {type: array, items: {type: object, additionalProperties: true}}
                          effectiveDate: {type: string, format: date}
                          version: {type: integer, format: int64}
        '404': {$ref: '#/components/responses/Error'}
  /sitemap-entries:
    get:
      tags: [Public content]
      summary: P10 Sitemap entries (page_size up to 1000)
      security: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200':
          description: Page of entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                          properties:
                            updatedAt: {type: string, format: date-time}
  /settings/public:
    get:
      tags: [Public content]
      summary: P12 Public settings
      security: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          supportEmail: {type: string}
                          deskContactHref: {type: string, nullable: true}
                          social: {type: object, additionalProperties: true}
                          defaultCity: {type: string}
        '404': {$ref: '#/components/responses/Error'}
  /contact:
    post:
      tags: [Public content]
      summary: P11 Contact form (202, stored then emailed to the configured destination)
      description: "Honeypot field `website` is silently accepted and dropped. 5 stored messages per hour per IP. The message is stored first; delivery to the destination (admin setting `notifications.contactDestinationEmail`, else env `CONTACT_DESTINATION_EMAIL`, else the public support email) is attempted once after the request and retried by the worker. The response never depends on delivery. `Idempotency-Key` is optional (ratified BE-14); a sent key is honoured."
      security: []
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, topic, message]
              properties:
                name: {type: string, maxLength: 80}
                email: {type: string, format: email}
                topic: {type: string, enum: [joining_event, partnership, payment, other]}
                message: {type: string, maxLength: 2000}
                website: {type: string, maxLength: 200, description: Honeypot, leave empty}
      responses:
        '202': {$ref: '#/components/responses/EmptyOk'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {description: IDEMPOTENCY_CONFLICT, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '429': {$ref: '#/components/responses/Error'}
  /preview/exchange:
    post:
      tags: [Public content]
      summary: Preview exchange (server to server; bearer PREVIEW_SECRET)
      description: 'Consumes a single-use preview link token (5 min) and returns a read key for the one item it names. The bearer is compared in constant time; when `PREVIEW_SECRET` is unset every call is 401. 30 calls per minute per IP (429). The response is `no-store`. `path` is a relative, allow-listed path (`/`, `/community`, `/privacy`, `/terms`, `/refund-policy`, `/events/{slug}`, `/stories/{slug}`). Send the key as `X-Preview-Key` on the public GETs for that item; it expires after 5 minutes.'
      security: []
      parameters:
        - {name: Authorization, in: header, required: true, description: 'Bearer PREVIEW_SECRET', schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, description: Token from the preview link returned by POST /admin/preview-link}
      responses:
        '200':
          description: Exchanged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          path: {type: string, example: /events/spring-social}
                          previewKey: {type: string}
                          expiresAt: {type: string, format: date-time}
        '400': {description: 'VALIDATION_FAILED (token invalid, expired or already used)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {description: 'AUTH_REQUIRED (missing or wrong bearer)', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '429': {$ref: '#/components/responses/Error'}

  # ----------------------------------------------------------------- Registration
  /events/{slug}/registration:
    get:
      tags: [Registration]
      summary: R01 Registration state for the signed-in player
      parameters:
        - {$ref: '#/components/parameters/Slug'}
      responses:
        '200':
          description: |
            `state` is one of open_free, open_paid, full_waitlist, sold_out, closed, not_yet_open, already_registered, ineligible.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
                        properties:
                          state: {type: string}
                          requiredProfileFields: {type: array, items: {type: string}}
                          serverNow: {type: string, format: date-time}
                          pricePaise: {type: integer}
                          currency: {type: string, example: INR}
                          holdMinutes: {type: integer}
                          waitlistPosition: {type: integer}
                          opensAt: {type: string, format: date-time}
                          reason: {type: string, example: profile_incomplete}
                          registration: {$ref: '#/components/schemas/Registration'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /registrations:
    post:
      tags: [Registration]
      summary: R02 Reserve a place (Idempotency-Key required)
      description: Free event returns `status=confirmed`. Paid event returns `status=pending` with a capacity hold.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventSlug]
              additionalProperties: false
              properties:
                eventSlug: {type: string, maxLength: 100}
                profile: {type: object, additionalProperties: true, description: Missing profile fields reported by R01}
      responses:
        '201':
          description: Reserved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: {type: string, enum: [confirmed, pending]}
                          registration: {$ref: '#/components/schemas/Registration'}
                          holdExpiresAt: {type: string, format: date-time}
                          serverNow: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {description: 'REGISTRATION_NOT_OPEN, REGISTRATION_CLOSED, EVENT_FULL or ALREADY_REGISTERED', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /registrations/waitlist:
    post:
      tags: [Registration]
      summary: R03 Join the waitlist (Idempotency-Key required)
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventSlug]
              additionalProperties: false
              properties:
                eventSlug: {type: string, maxLength: 100}
      responses:
        '201':
          description: Waitlisted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          registration: {$ref: '#/components/schemas/Registration'}
                          position: {type: integer}
        '409': {$ref: '#/components/responses/Error'}
  /registrations/{registrationId}:
    get:
      tags: [Registration]
      summary: R06 Registration detail (owner only, polling-safe)
      parameters:
        - {$ref: '#/components/parameters/RegistrationId'}
      responses:
        '200':
          description: Registration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Registration'}
        '404': {$ref: '#/components/responses/Error'}
  /registrations/{registrationId}/cancel:
    post:
      tags: [Registration]
      summary: R07 Cancel a registration (Idempotency-Key optional)
      parameters:
        - {$ref: '#/components/parameters/RegistrationId'}
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string}}
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          registration: {$ref: '#/components/schemas/Registration'}
        '409': {description: CANCELLATION_NOT_ALLOWED, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /registrations/{registrationId}/accept-offer:
    post:
      tags: [Registration]
      summary: R08 Accept a waitlist offer (Idempotency-Key required)
      parameters:
        - {$ref: '#/components/parameters/RegistrationId'}
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      responses:
        '200':
          description: Offer accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          registration: {$ref: '#/components/schemas/Registration'}
        '409': {$ref: '#/components/responses/Error'}
  /payments/orders:
    post:
      tags: [Registration]
      summary: R04 Create or return the payment order (Idempotency-Key required)
      description: |
        Requires a live capacity hold (`HOLD_EXPIRED` otherwise). One order per registration: a repeat returns the same
        order. Amount, currency and key come only from this response; the browser never supplies them.
        `PAYMENT_UNAVAILABLE` (503) when the payment provider cannot be reached.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationId]
              additionalProperties: false
              properties:
                registrationId: {type: string, format: uuid}
      responses:
        '200':
          description: The order to open Razorpay Checkout with
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [orderId, amountPaise, currency, keyId, holdExpiresAt, serverNow]
                        properties:
                          orderId: {type: string, example: order_Abc123}
                          amountPaise: {type: integer, minimum: 1}
                          currency: {type: string, example: INR}
                          keyId: {type: string, description: Public Razorpay key id (never the secret)}
                          holdExpiresAt: {type: string, format: date-time}
                          serverNow: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'HOLD_EXPIRED or ALREADY_REGISTERED', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '503': {description: PAYMENT_UNAVAILABLE, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /payments/verify:
    post:
      tags: [Registration]
      summary: R05 Verify a Checkout payment (Idempotency-Key required)
      description: |
        The server resolves the order and user from `razorpay_order_id` (an order that is not the caller's is 404),
        checks the checkout signature in constant time (`INVALID_SIGNATURE`), fetches the payment from Razorpay and
        checks order id, exact amount, currency and status (`PAYMENT_MISMATCH`), writes the ledger and confirms the
        registration. Returns `confirming` when the payment is authorized but not yet captured. Repeats return the
        same result. If the money arrived after the hold lapsed with no seat left, the payment is refunded
        automatically and the call answers `HOLD_EXPIRED`.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
              additionalProperties: false
              properties:
                razorpay_order_id: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_]+$'}
                razorpay_payment_id: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_]+$'}
                razorpay_signature: {type: string, maxLength: 128}
      responses:
        '200':
          description: Registration in `confirming` or `confirmed`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [registration]
                        properties:
                          registration: {$ref: '#/components/schemas/Registration'}
        '400': {description: 'VALIDATION_FAILED or INVALID_SIGNATURE', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'PAYMENT_MISMATCH or HOLD_EXPIRED', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
        '503': {description: PAYMENT_UNAVAILABLE, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  /webhooks/razorpay:
    post:
      tags: [Webhooks]
      summary: W01 Razorpay webhook (inbound from Razorpay, not called by the web app)
      description: |
        No bearer auth, no envelope, no per-user rate limit. Authenticated only by `X-Razorpay-Signature`, the
        HMAC-SHA256 of the RAW body with the webhook secret, checked in constant time before the JSON is parsed.
        Failure answers 400 `{received:false}`. Each `X-Razorpay-Event-Id` is stored once; a repeat answers 200 with no
        side effects. Handled: `payment.captured`, `payment.failed`, `order.paid`, `refund.processed`,
        `refund.failed`; any other event is stored and acknowledged. 5xx only for transient faults (the provider retries).
      security: []
      parameters:
        - {name: X-Razorpay-Signature, in: header, required: true, schema: {type: string}}
        - {name: X-Razorpay-Event-Id, in: header, required: false, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Accepted (or a duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: {type: boolean}
                  duplicate: {type: boolean}
        '400':
          description: Bad or missing signature, or malformed body
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: {type: boolean, example: false}
